    <script>
      // Suprime avisos e erros inofensivos de WebSocket HMR no ambiente de sandbox do AI Studio
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.indexOf('WebSocket') !== -1 ||
          event.message.indexOf('@vite/client') !== -1 ||
          event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1
        )) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).indexOf('WebSocket') !== -1 ||
          String(event.reason).indexOf('@vite/client') !== -1
        )) {
          event.preventDefault();
        }
      });
    </script>
